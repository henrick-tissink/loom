<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>loom</title>
  </head>
  <body>
    <!-- A thin drag strip on the ground. The islands below are the UI. -->
    <header id="titlebar">
      <span class="wordmark">
        <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="mk">loom</span>
      </span>
      <div class="tb-right">
        <!-- Hide/solo chip (§6.4). Permanent rather than a toast: a restart
             mid-demo that silently revealed a project is the worse failure. -->
        <button id="hidechip" class="hidechip" title="Hiding is in force"></button>
      </div>
    </header>
    <main id="body">
      <!-- Projects: an icon dock by default; expands to a named list. -->
      <aside id="projects-pane">
        <div class="pp-head">
          <span class="pp-title">Projects</span>
          <button id="new-project" title="New project">+ New</button>
        </div>
        <ul id="projects"></ul>
        <div class="pp-foot">
          <button id="new-session" title="New session" aria-label="New session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="search-btn" title="Search history (/)" aria-label="Search history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <button id="disc-btn" title="Agent Discipline" aria-label="Agent Discipline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></svg>
            <i class="disc-dot" id="disc-dot"></i>
          </button>
          <button id="prefs-btn" title="Preferences" aria-label="Preferences">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          </button>
          <button id="pp-collapse" title="Expand projects" aria-label="Expand projects">›</button>
        </div>
      </aside>
      <aside id="threads-pane">
        <div id="threads-head"></div>
        <!-- Attention capsule: how many need you and how long the oldest has
             waited. A readout that is also the way into the queue. -->
        <button id="attn" class="attn"></button>
        <ul id="threads"></ul>
      </aside>
      <section id="stage"><div id="stage-empty">Select a session, or press + New</div></section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
